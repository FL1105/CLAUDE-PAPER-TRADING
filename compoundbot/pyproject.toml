[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compoundbot"
version = "0.1.0"
description = "Paper-first, lower-volatility multi-asset trading research and execution system. No real-money code paths."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
dash = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: larger synthetic acceptance runs (run with -m slow)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
