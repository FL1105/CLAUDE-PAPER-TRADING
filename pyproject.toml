[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Paper-trading research system for Polymarket wallet-edge copying with statistical promotion gates. No real-money code paths."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.5",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
history = [
    "duckdb>=1.0",
    "pyarrow>=15",
]
dev = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
    "scipy-stubs",
]

[project.scripts]
polybot = "polybot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not network'"
markers = [
    "network: hits real Polymarket endpoints (deselected by default; run with -m network)",
    "slow: full-size synthetic acceptance runs (deselected by default; run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008"]  # typer.Option in defaults is the documented typer idiom

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["polybot.stats.*", "polybot.gates.*", "polybot.execution.*"]
strict = true

[tool.coverage.run]
source = ["polybot"]
